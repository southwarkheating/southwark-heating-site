<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the right boiler | Southwark Heating (PROTOTYPE)</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#112B4F">
<style>
:root{
  --navy:#112B4F; --navy-dk:#0C1F38; --red:#C42727; --red-dk:#8E1B1B;
  --ink:#1B2733; --mut:#5A6978; --line:#DDE3E9; --bg:#F4F6F9; --tint:#EAF0F8; --ok:#1E7B4B; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0)}
img{max-width:100%;height:auto}
button,input,select{font:inherit}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}

/* header */
.demo-bar{background:var(--red-dk);color:#fff;text-align:center;font-size:.85rem;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.hdr{background:#fff;border-bottom:4px solid var(--red);position:sticky;top:0;z-index:20}
.hdr-in{max-width:1080px;margin:0 auto;padding:0 20px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr img{display:block;width:150px}
.hdr a.tel{color:var(--navy);font-weight:700;text-decoration:none;white-space:nowrap}

/* progress */
.progress{background:#fff;border-bottom:1px solid var(--line)}
.progress-in{max-width:720px;margin:0 auto;padding:12px 20px}
.progress-top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}

main{outline:none}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 40px}
.wrap.wide{max-width:1080px}
h1,h2,h3{color:var(--navy);line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,6vw,2.4rem)}
h2{font-size:clamp(1.35rem,4.5vw,1.8rem);margin-bottom:6px}
h3{font-size:1.1rem}
.help{color:var(--mut);margin:0 0 18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 2px 10px rgba(17,43,79,.07)}

/* welcome */
.welcome{background:linear-gradient(135deg,#0c1f38 0%,#112B4F 55%,#1d4a85 100%);color:#fff;border-radius:12px;padding:32px 22px;border-bottom:6px solid var(--red)}
.welcome h1{color:#fff;margin-bottom:12px}
.welcome p{margin:0 0 14px;max-width:34rem;color:rgba(255,255,255,.92);font-size:1.05rem}
.welcome .trust{font-size:.9rem;color:rgba(255,255,255,.75);margin-top:18px}
.how{display:grid;gap:10px;margin:18px 0 22px;padding:0;list-style:none}
.how li{background:rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:.98rem}

/* buttons */
.btn{display:inline-block;padding:14px 24px;border-radius:8px;font-weight:700;border:0;cursor:pointer;font-size:1rem;text-decoration:none;text-align:center}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dk)}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:12px 22px}
.btn-light{background:#fff;color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{font-size:1.15rem;padding:16px 30px}
.nav-row{display:flex;gap:12px;justify-content:space-between;margin-top:22px}
.nav-row .btn{flex:1}
@media(min-width:600px){.nav-row .btn{flex:0 0 auto;min-width:160px}}

/* choice cards */
.opts{display:grid;gap:12px}
@media(min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:block;position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .face{display:block;background:#fff;border:2px solid var(--line);border-radius:10px;padding:16px 18px;min-height:64px;transition:border-color .15s,background .15s}
.opt .face b{display:block;color:var(--navy);font-size:1.05rem}
.opt .face small{display:block;color:var(--mut);margin-top:2px}
.opt:hover .face{border-color:#9FB0C2}
.opt input:checked+.face{border-color:var(--red);background:#FFF4F2;box-shadow:inset 0 0 0 1px var(--red)}
.opt input:focus-visible+.face{outline:3px solid var(--navy);outline-offset:2px}

/* steppers */
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.stepper-row:last-child{border-bottom:0}
.stepper-row .lbl b{display:block;color:var(--navy)}
.stepper-row .lbl small{color:var(--mut)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:1.5rem;line-height:1;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:38px;text-align:center;font-size:1.4rem;font-weight:700;color:var(--navy)}

/* fields */
.fields{display:grid;gap:14px}
.field label{display:block;font-weight:600;color:var(--navy);margin-bottom:5px}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number]{font-size:16px;padding:12px;border:1px solid #B9C4CF;border-radius:8px;width:100%;background:#fff}
.field .err{color:var(--red-dk);font-weight:600;font-size:.9rem;margin-top:4px}
.field input.bad{border-color:var(--red);border-width:2px}
.check{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px}
.note{font-size:.88rem;color:var(--mut);margin-top:14px}

/* results */
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(min-width:700px){.analysis{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;padding:14px}
.tile .v{font-size:1.3rem;font-weight:800;color:var(--navy);line-height:1.1}
.tile .k{font-size:.88rem;color:var(--mut);margin-top:4px}
.gauge{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px 10px;margin:16px 0}
.gauge h3{margin-bottom:4px}
.gauge p.sub{margin:0 0 12px;color:var(--mut);font-size:.92rem}
.lane{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px;margin:8px 0}
.lane .ln{font-weight:700;color:var(--navy);font-size:.92rem}
.track{position:relative;height:30px;background:#F0F3F7;border-radius:6px}
.band{position:absolute;top:0;bottom:0;background:rgba(29,74,133,.16);border-left:2px solid var(--navy);border-right:2px solid var(--navy)}
.need{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--red)}
.dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--navy);border:2px solid #fff;box-shadow:0 0 0 1px var(--navy)}
.dot.out{background:#fff;box-shadow:0 0 0 2px #9FB0C2}
.dot.best{background:var(--red);box-shadow:0 0 0 2px var(--red);width:18px;height:18px;margin:-9px 0 0 -9px}
.lane-note{font-size:.82rem;color:var(--red-dk);grid-column:2}
.axis{display:grid;grid-template-columns:74px 1fr;gap:10px}
.axis div{position:relative;height:18px;font-size:.78rem;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--mut);margin:8px 0 4px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.legend .d{width:12px;height:12px;border-radius:50%;background:var(--navy)}
.legend .d.o{background:#fff;box-shadow:0 0 0 2px #9FB0C2}
.legend .d.b{background:var(--red)}
.legend .l{width:0;height:14px;border-left:2px dashed var(--red)}
.legend .w{width:18px;height:12px;background:rgba(29,74,133,.16);border-left:2px solid var(--navy);border-right:2px solid var(--navy)}

.cards{display:grid;gap:18px;margin:18px 0}
@media(min-width:1000px){.cards.n3{grid-template-columns:repeat(3,1fr)}.cards.n2{grid-template-columns:repeat(2,1fr)}}
.bcard{background:#fff;border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.bcard.best{border-color:var(--red);box-shadow:0 6px 22px rgba(196,39,39,.18)}
.bcard.chosen{outline:4px solid var(--navy);outline-offset:2px}
.bflag{padding:8px 16px;font-weight:800;letter-spacing:.02em;background:var(--navy);color:#fff;display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.bcard.best .bflag{background:var(--red)}
.bflag .demo{font-weight:600;opacity:.9;font-size:.8rem}
.bbody{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.img-ph{background:var(--tint);border:2px dashed #B9C4CF;border-radius:8px;height:120px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.8rem;flex-direction:column;gap:4px}
.img-ph svg{width:46px;height:56px}
.mfr{color:var(--mut);font-size:.92rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tint);color:var(--navy);border-radius:99px;padding:3px 11px;font-size:.84rem;font-weight:600}
.why{background:#F7F9FC;border-left:4px solid var(--navy);border-radius:6px;padding:10px 12px;font-size:.93rem}
.why b{display:block;color:var(--navy);margin-bottom:3px}
.why ul{margin:0;padding-left:18px}
.pricebox{border-top:1px solid var(--line);padding-top:10px}
.prow{display:flex;justify-content:space-between;gap:10px;font-size:.94rem;padding:2px 0}
.prow.sub{color:var(--mut);font-size:.88rem}
.prow.total{font-size:1.35rem;font-weight:800;color:var(--navy);border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.extras{border:1px solid var(--line);border-radius:8px;padding:4px 12px;background:#fff}
.extras legend{font-weight:700;color:var(--navy);padding:0 4px}
.xrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}
.xrow input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.xrow .xt{flex:1;font-size:.93rem}
.xrow .xt small{display:block;color:var(--mut)}
.xrow .xp{font-weight:700;color:var(--navy);white-space:nowrap}
.xrow select{padding:6px;border:1px solid #B9C4CF;border-radius:6px;font-size:16px}
.tag{display:inline-block;background:#FFF4F2;color:var(--red-dk);border-radius:4px;padding:0 6px;font-size:.76rem;font-weight:700;margin-left:4px}
details.more{border:1px solid var(--line);border-radius:8px;background:#fff;margin:10px 0}
details.more summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy)}
details.more .in{padding:0 14px 14px;font-size:.93rem}
details.more ul{margin:6px 0;padding-left:20px}
.owner{background:#FFFBEA;border-color:#E8D77A}
.owner table{width:100%;border-collapse:collapse;font-size:.88rem}
.owner td{padding:3px 0}.owner td:last-child{text-align:right;white-space:nowrap}
.cmp{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px 0}
.cmp table{border-collapse:collapse;min-width:560px;width:100%;font-size:.93rem}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th:first-child{color:var(--mut);font-weight:600;width:150px}
.cmp thead th{background:var(--navy);color:#fff}
.cmp td.hl{background:#FFF4F2;font-weight:700}
.disclaimer{background:#FFF4F2;border-left:5px solid var(--red);border-radius:6px;padding:14px 16px;font-size:.93rem;margin:18px 0}
.disclaimer p{margin:0 0 8px}.disclaimer p:last-child{margin:0}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.selbar .t{font-size:.9rem;line-height:1.3}.selbar .t b{display:block;font-size:1.1rem}
.selbar .btn{padding:11px 18px}
.spacer{height:84px}
.summary dl{margin:0;display:grid;grid-template-columns:1fr;gap:2px 16px}
@media(min-width:600px){.summary dl{grid-template-columns:170px 1fr}}
.summary dt{color:var(--mut);font-weight:600}
.summary dd{margin:0 0 8px;overflow-wrap:anywhere}
.ruled li{margin-bottom:6px}
footer{text-align:center;color:var(--mut);font-size:.82rem;padding:10px 20px 30px}
.linklike{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.demo-bar,.hdr,.progress,.selbar,.nav-row,.btn{display:none!important}}
</style>
</head>

  areaMid: { u60:45, a60:80, a100:125, a150:175, o200:240 },     // m² used for each size band
  unsureBase: 30, unsurePerBed: 17,                                // size guess when the customer is not sure
  typeAreaFactor: { house:1, flat:0.9, bungalow:1.1, other:1 },
  wPerM2: { house:70, flat:55, bungalow:75, other:70 },             // demo heat-loss allowance, watts per m²
  floorUplift: 0.03,                                               // extra heat need for each floor above two
  flow: { shower:9, bath:12, tap:4 },                              // litres per minute per outlet
  demandFactor: { normal:1, high:1.15, veryhigh:1.3, unsure:1.1 },
  lpmPerKwCombi: 0.41,                                             // litres/min of hot water per kW of combi output (about 35°C rise)
  cylinderBaseKw: 2, cylinderPerExtraBathKw: 0.75, minStoredKw: 10, // allowance added for reheating a cylinder
  combiMaxBathrooms: 2,                                            // 3 or more bathrooms: stored hot water advised
  accept: { minRatio: 0.95, maxRatio: 1.8, maxExtraKw: 8 },        // acceptable output window: ≥95% of need, and not far above it
  existingWeight: 0.2                                              // how far a known existing boiler output nudges the heat estimate
};

/* =====================================================================
   SECTION 3: QUESTIONS  (text and options for the interface)

  simult:[ {v:'yes',t:'Yes',s:'For example two showers, or a shower and a running tap'},{v:'no',t:'No',s:'Usually one at a time'},{v:'unsure',t:'Not sure'} ],
  system:[ {v:'combi',t:'Combi boiler',s:'Heats water instantly, no hot water tank'},{v:'system',t:'System boiler',s:'Works with a hot water cylinder'},{v:'regular',t:'Regular / conventional boiler',s:'Tanks in the loft and a hot water cylinder'},{v:'unsure',t:'Not sure'} ],

const STEPS = [

  { id:'rooms',    kind:'steppers', q:'How many bedrooms and floors?', help:'Count every level that has radiators, including a loft conversion.',
    fields:[ {key:'beds',label:'Bedrooms',min:1,max:8}, {key:'floors',label:'Floors',min:1,max:4} ] },

    fields:[ {key:'baths',label:'Bathrooms',min:1,max:6}, {key:'showers',label:'Showers',min:0,max:8}, {key:'tubs',label:'Baths',min:0,max:6} ] },
  { id:'demand',   kind:'choice', key:'demand', q:'How much hot water does your household use?', help:'This affects how much hot water the boiler needs to supply.' },
  { id:'simult',   kind:'choice', key:'simult', q:'Will more than one shower or tap run at the same time?', help:'For example two people showering together.' },

/* =====================================================================
   SECTION 4: RECOMMENDATION ENGINE  (no interface code in here)
   analyse(answers) -> what the home needs
   evaluate(boiler)  -> suitable or ruled out, with a score and reasons
   recommend(answers) -> ranked list and the three picks
   ===================================================================== */
function analyse(a){
  const S = SIZING;
  const known = S.areaMid[a.area] != null;
  const area = known ? S.areaMid[a.area]
             : Math.round((S.unsureBase + a.beds * S.unsurePerBed) * (S.typeAreaFactor[a.propType] || 1));
  let heat = area * (S.wPerM2[a.propType] || 70) / 1000 * (1 + Math.max(0, a.floors - 2) * S.floorUplift);
  const exKw = a.exKwUnknown ? 0 : parseFloat(a.exKw) || 0;
  if(exKw > 0){ heat = (1 - S.existingWeight) * heat + S.existingWeight * Math.min(exKw * 0.55, heat * 1.5); }
  heat = Math.round(heat * 10) / 10;

  const df = S.demandFactor[a.demand] || 1.1;
  const outlets = [];
  for(let i = 0; i < a.showers; i++) outlets.push(S.flow.shower);
  for(let i = 0; i < a.tubs; i++) outlets.push(S.flow.bath);
  outlets.push(S.flow.tap);
  outlets.sort(function(x, y){ return y - x; });
  let concurrent = a.simult === 'yes' ? 2 : a.simult === 'no' ? 1 : ((a.baths >= 2 || a.showers + a.tubs >= 3) ? 2 : 1);
  concurrent = Math.min(concurrent, outlets.length);
  const flow = Math.round(outlets.slice(0, concurrent).reduce(function(s, x){ return s + x; }, 0) * df * 10) / 10;

  const storedKw = Math.max(S.minStoredKw, heat + (S.cylinderBaseKw + S.cylinderPerExtraBathKw * (a.baths - 1)) * df);
  const combiKw = Math.max(heat, flow / S.lpmPerKwCombi);

  function lane(req, blocked, note){
    return { required: Math.round(req * 10) / 10, min: req * S.accept.minRatio,
             max: Math.max(req * S.accept.maxRatio, req + S.accept.maxExtraKw), blocked: blocked || null, note: note || '' };
  }
  const combiBlocked = a.baths > S.combiMaxBathrooms ? (a.baths + ' bathrooms: a stored hot water system is the safer choice') : null;
  return {
    area: area, areaKnown: known, heat: heat, flow: flow, concurrent: concurrent, exKw: exKw,
    storedPreferred: !!combiBlocked || concurrent >= 3,
    lanes: {
      combi:   lane(combiKw, combiBlocked, 'Must supply about ' + flow + ' L/min of hot water at once'),
      system:  lane(storedKw),
      regular: lane(storedKw)
    }
  };
}

function evaluate(b, a, need){
  const S = SIZING, L = need.lanes[b.type], out = { boiler:b };
  if(!b.active){ out.ok = false; out.reason = 'Not currently offered.'; return out; }
  if(L.blocked){ out.ok = false; out.reason = L.blocked + '.'; return out; }
  if(b.type === 'regular' && (a.system === 'combi' || a.system === 'system')){
    out.ok = false; out.reason = 'A regular boiler needs loft tanks and a vented cylinder, which a ' + a.system + ' setup does not have.'; return out;
  }
  if(b.type === 'combi' && b.output * S.lpmPerKwCombi < need.flow * S.accept.minRatio){
    out.ok = false; out.reason = 'Hot water flow too low: it manages about ' + (b.output * S.lpmPerKwCombi).toFixed(1) + ' L/min but your usage could need about ' + need.flow + ' L/min.'; return out;
  }
  if(b.output < L.min){
    out.ok = false; out.reason = b.output + ' kW is too low. Your home needs roughly ' + L.required + ' kW or more.'; return out;
  }
  if(b.output > L.max){
    out.ok = false; out.reason = b.output + ' kW is much more than your home needs (about ' + L.required + ' kW). An oversized boiler wastes fuel.'; return out;
  }
  const ratio = b.output / L.required;
  let score = ratio < 1 ? 100 - (1 - ratio) * 300 : ratio <= 1.25 ? 100 : 100 - (ratio - 1.25) * 50;
  const why = [];
  const stored = b.type !== 'combi';
  const bathrooms = a.baths;

  if(!stored){
    why.push('Supplies about ' + (b.output * S.lpmPerKwCombi).toFixed(1) + ' L/min of hot water, enough for the roughly ' + need.flow + ' L/min your usage could need.');
    score += bathrooms === 1 ? 10 : 4;
    if(a.propType === 'flat'){ score += 6; why.push('A combi suits a flat because no hot water cylinder is needed.'); }
  } else {
    why.push('Heats a cylinder, so several taps and showers can run together without the flow dropping.');
    if(need.storedPreferred) score += 10;
    if(bathrooms >= 3) why.push('Stored hot water is the better fit with ' + bathrooms + ' bathrooms.');
  }
  if(ratio <= 1.25) why.push(b.output + ' kW closely matches the roughly ' + L.required + ' kW your home needs.');
  else why.push(b.output + ' kW gives extra headroom over the roughly ' + L.required + ' kW your home needs.');

  if(a.system === b.type){ score += 4; why.push('Same type as your current boiler, which usually keeps the swap simpler.'); }
  if(b.type === 'regular'){ score += a.system === 'regular' ? 6 : -4; }
  if(a.system === 'regular' && b.type === 'combi') why.push('Switching from a tank-fed system to a combi removes the loft tanks and cylinder.');
  if(need.exKw > 0){ score += 4 * Math.max(0, 1 - Math.abs(b.output - need.exKw) / need.exKw); }
  score += Math.min(5, b.warranty * 0.5);
  why.push(b.warranty + '-year warranty.');

  out.ok = true; out.ratio = ratio; out.why = why;
  out.score = Math.max(0, Math.min(100, Math.round(score)));
  return out;
}

function recommend(a){
  const need = analyse(a);
  const evals = BOILERS.map(function(b){ return evaluate(b, a, need); });
  const ranked = evals.filter(function(e){ return e.ok; }).sort(function(x, y){
    return y.score - x.score || (priceOf(x.boiler).base - priceOf(y.boiler).base);
  });
  const picks = [];
  if(ranked[0]) picks.push({ e:ranked[0], label:'BEST MATCH', cls:'best' });
  if(ranked[1]) picks.push({ e:ranked[1], label:'GOOD ALTERNATIVE', cls:'alt' });
  if(ranked.length > 2){
    const higher = ranked.slice(2).filter(function(e){ return e.boiler.output > ranked[0].boiler.output; })
                         .sort(function(x, y){ return y.score - x.score; })[0];
    const third = higher || ranked[2];
    picks.push({ e:third, label: higher ? 'HIGHER-OUTPUT OPTION' : 'ANOTHER OPTION', cls:'alt' });
  }
  return { need: need, evals: evals, ranked: ranked, picks: picks };
}

/* =====================================================================
   SECTION 5: PRICE CALCULATION  (reads only the data in Section 1)
   ===================================================================== */
function getSupplierCost(b){
  // FUTURE: if PRICING.priceSource === 'wolseley', look up b.supplierSku in a supplier price list here.
  return b.supplierCost;
}
function priceOf(b){
  const supplier = getSupplierCost(b);
  const pk = b.installAllowance;
  const pkgTotal = pk.labour + pk.materials + pk.margin;
  const base = b.customerPriceOverride != null ? b.customerPriceOverride : supplier + b.flueCost + pkgTotal;
  return { supplier: supplier, flue: b.flueCost, pkg: pk, pkgTotal: pkgTotal, base: base,
           boilerAndFlue: base - pkgTotal };
}
function defaultExtras(b, a){
  const sel = {};
  if(a.sameLoc === 'no') sel.relocate = 1;
  if(b.type === 'system' && a.system !== 'system' && a.system !== 'regular') sel.cylinder = 1;
  if(b.type === 'combi' && (a.system === 'system' || a.system === 'regular')) sel.strip = 1;
  return sel;
}
function extrasTotals(b, sel){
  let req = 0, opt = 0;
  EXTRAS.forEach(function(x){
    if(x.appliesTo.indexOf(b.type) < 0) return;
    const q = sel[x.id] || 0;
    if(x.kind === 'requirement') req += q * x.price; else opt += q * x.price;
  });
  return { req: req, opt: opt };
}
function totalFor(b){
  const p = priceOf(b), t = extrasTotals(b, state.extras[b.id] || {});
  return { p: p, req: t.req, opt: t.opt, total: p.base + t.req + t.opt };
}

  if(s.kind === 'choice') return !!state.a[s.key];
  if(s.kind === 'details'){
    const a = state.a; errors = {};
    if(!a.name.trim()) errors.name = 'Enter your name.';
    if(!/^[A-Za-z]{1,2}\d[A-Za-z\d]?\s*\d[A-Za-z]{2}$/.test(a.postcode.trim())) errors.postcode = 'Enter a full UK postcode, for example SE1 1AA.';
    if(!a.address.trim()) errors.address = 'Enter your address.';
    if(a.phone.replace(/\D/g, '').length < 10) errors.phone = 'Enter a phone number with at least 10 digits.';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email.trim())) errors.email = 'Enter a valid email address.';
    return Object.keys(errors).length === 0;
  }
  return true;

/* ---------- results ---------- */
function fmtPos(kw){ return Math.max(0, Math.min(100, kw / 40 * 100)); }
function renderGauge(R, bestId){
  const N = R.need, lanes = [['combi','Combi'],['system','System'],['regular','Regular']];
  const rows = lanes.map(function(l){
    const L = N.lanes[l[0]];
    let band = '';
    if(!L.blocked && L.min < 40){
      const lo = fmtPos(L.min), hi = fmtPos(Math.min(L.max, 40));
      band = '<div class="band" style="left:' + lo + '%;width:' + (hi - lo) + '%" title="Output range that suits your home"></div>';
    }
    const dots = R.evals.filter(function(e){ return e.boiler.type === l[0] && e.boiler.active; }).map(function(e){
      const cls = e.boiler.id === bestId ? 'best' : e.ok ? '' : 'out';
      return '<span class="dot ' + cls + '" style="left:' + fmtPos(e.boiler.output) + '%" title="' + esc(e.boiler.manufacturer + ' ' + e.boiler.model + ' (' + e.boiler.output + ' kW)' + (e.ok ? '' : ': ruled out')) + '"></span>';
    }).join('');
    let note = '';
    if(L.blocked) note = L.blocked + '.';
    else if(l[0] === 'combi' && L.min >= 40) note = 'No combi can supply about ' + N.flow + ' L/min.';
    else if(l[0] === 'combi') note = L.note + '.';
    return '<div class="lane"><div class="ln">' + l[1] + '</div><div class="track">' + band + '<span class="need" style="left:' + fmtPos(N.heat) + '%" title="Estimated heating need"></span>' + dots + '</div>' +
      (note ? '<div class="lane-note">' + esc(note) + '</div>' : '') + '</div>';
  }).join('');
  const ticks = [0,10,20,30,40].map(function(t){ return '<span style="left:' + fmtPos(t) + '%">' + t + '</span>'; }).join('');
  return '<div class="gauge"><h3>How your home compares with each boiler</h3><p class="sub">Output in kW. Shaded bands show the output range that suits your home for each type of boiler.</p>' + rows +
    '<div class="axis"><div></div><div>' + ticks + '</div></div>' +
    '<div class="legend"><span><i class="w"></i>Suitable output range</span><span><i class="l"></i>Estimated heating need</span><span><i class="d b"></i>Best match</span><span><i class="d"></i>Suitable</span><span><i class="d o"></i>Ruled out</span></div></div>';
}

  return group('requirement', 'Additional installation requirements') + group('extra', 'Optional extras');
}
function priceRows(b){
  const t = totalFor(b), id = b.id;
  return '<div class="prow"><span>Boiler, flue and fittings</span><span>' + gbp(t.p.boilerAndFlue) + '</span></div>' +
    '<div class="prow"><span>Standard installation package</span><span>' + gbp(t.p.pkgTotal) + '</span></div>' +
    (t.req ? '<div class="prow"><span>Additional requirements</span><span>' + gbp(t.req) + '</span></div>' : '') +
    (t.opt ? '<div class="prow"><span>Optional extras</span><span>' + gbp(t.opt) + '</span></div>' : '') +
    '<div class="prow total"><span>Estimated total</span><span>' + gbp(t.total) + '</span></div>';
}
function ownerView(b){
  const p = priceOf(b);
  return '<details class="more owner"><summary>Owner view: how this price is built</summary><div class="in"><table>' +
    '<tr><td>Wolseley / Plumb Centre cost (' + PRICING.label + ')</td><td>' + gbp(p.supplier) + '</td></tr>' +
    '<tr><td>Standard flue and components</td><td>' + gbp(p.flue) + '</td></tr>' +
    '<tr><td>Installation package: labour</td><td>' + gbp(p.pkg.labour) + '</td></tr>' +
    '<tr><td>Installation package: materials</td><td>' + gbp(p.pkg.materials) + '</td></tr>' +
    '<tr><td>Installation package: margin</td><td>' + gbp(p.pkg.margin) + '</td></tr>' +
    '<tr><td><b>Estimated installed price (before additions)</b></td><td><b>' + gbp(p.base) + '</b></td></tr></table>' +
    '<p style="margin:8px 0 0">Normally needs: ' + esc(b.requiredComponents.join(', ') || 'n/a') + '.</p>' +
    '<p style="margin:6px 0 0;color:#5A6978">Edit these figures in the PRICING DATA section of the file. This panel is for you, remove it before showing customers.</p></div></details>';
}
function renderCard(pick, many){
  const b = pick.e.boiler, sel = state.selectedId === b.id;
  return '<article class="bcard ' + pick.cls + (sel ? ' chosen' : '') + '" aria-label="' + esc(b.manufacturer + ' ' + b.model) + '">' +
    '<div class="bflag"><span>' + pick.label + '</span><span class="demo">' + PRICING.label + ' MODEL AND PRICE</span></div>' +
    '<div class="bbody">' +
    '<div class="img-ph"><svg viewBox="0 0 46 56" fill="none" stroke="#5A6978" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="36" height="42" rx="5"/><circle cx="23" cy="20" r="8"/><path d="M12 51v4M20 51v4M28 51v4M36 51v4"/></svg>Image placeholder</div>' +
    '<div><div class="mfr">' + esc(b.manufacturer) + '</div><h3>' + esc(b.model) + '</h3></div>' +
    '<div class="chips"><span class="chip">' + b.output + ' kW ' + b.type.charAt(0).toUpperCase() + b.type.slice(1) + '</span><span class="chip">' + b.warranty + '-year warranty</span><span class="chip">Match score ' + pick.e.score + '/100</span></div>' +
    '<p style="margin:0">' + esc(b.description) + '</p>' +
    '<div class="why"><b>Why we recommend it</b><ul>' + pick.e.why.slice(0, 4).map(function(w){ return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' +
    renderExtras(b) +
    '<div class="pricebox" data-price="' + b.id + '">' + priceRows(b) + '</div>' +
    '<details class="more"><summary>What the standard installation package covers</summary><div class="in"><ul>' + STANDARD_PACKAGE_INCLUDES.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul><p style="margin:6px 0 0">Based on a straightforward like-for-like swap. Anything beyond this is confirmed at the survey.</p></div></details>' +
    ownerView(b) +
    '<button class="btn ' + (sel ? 'btn-navy' : 'btn-red') + '" type="button" data-act="choose" data-id="' + b.id + '">' + (sel ? 'Selected. Review my selection' : 'Choose this boiler') + '</button>' +
    '</div></article>';
}
function renderCompare(R){
  const P = R.picks;
  const rows = [
    ['Manufacturer', function(b){ return esc(b.manufacturer); }],
    ['Model', function(b){ return esc(b.model); }],
    ['Type', function(b){ return b.type.charAt(0).toUpperCase() + b.type.slice(1); }],
    ['Output', function(b){ return b.output + ' kW'; }],
    ['Warranty', function(b){ return b.warranty + ' years'; }],
    ['Match score', function(b, e){ return e.score + '/100'; }],
    ['Boiler, flue and fittings', function(b){ return gbp(priceOf(b).boilerAndFlue); }],
    ['Standard installation package', function(b){ return gbp(priceOf(b).pkgTotal); }],
    ['Estimated total (with your selections)', function(b){ return '<span data-cmp="' + b.id + '">' + gbp(totalFor(b).total) + '</span>'; }]
  ];
  return '<div class="cmp" id="cmpTable"><table><thead><tr><th scope="col">Compare</th>' + P.map(function(p){ return '<th scope="col">' + p.label + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r, i){ return '<tr><th scope="row">' + r[0] + '</th>' + P.map(function(p){ return '<td' + (i === rows.length - 1 ? ' class="hl"' : '') + '>' + r[1](p.e.boiler, p.e) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
const DISCLAIMER = '<div class="disclaimer">' +
  '<p><b>Please read.</b> Your recommendation is based on the information you provide. Final boiler suitability, system requirements, installation requirements and final price are subject to confirmation by Southwark Heating following a professional assessment. This online recommendation is not a substitute for a professional heat-loss calculation where required.</p>' +
  '<p>Prices shown are estimates based on the information you supplied. The final price may change if the installation needs additional work, materials, access arrangements, flue changes, pipework alterations, system modifications or other requirements found during the assessment. Southwark Heating will confirm the final recommendation and installation price before any work starts.</p>' +
  '<p><b>Prototype notice:</b> boilers, prices and sizing rules on this page are demonstration figures only. They are not certified and must not be used to size a real installation.</p></div>';

function renderResults(){
  const R = recommend(state.a);
  const N = R.need, a = state.a;
  state.R = R;
  R.ranked.forEach(function(e){ if(!state.extras[e.boiler.id]) state.extras[e.boiler.id] = defaultExtras(e.boiler, a); });
  const bestId = R.picks[0] ? R.picks[0].e.boiler.id : null;
  const maxCombiKw = Math.max.apply(null, BOILERS.filter(function(b){ return b.active && b.type === 'combi'; }).map(function(b){ return b.output; }).concat([0]));
  const combiCan = !N.lanes.combi.blocked && maxCombiKw * SIZING.lpmPerKwCombi >= N.flow * SIZING.accept.minRatio;
  const hw = !combiCan ? 'Stored hot water advised' : (N.storedPreferred ? 'Stored hot water favoured' : 'A combi can work');
  let h = '<div class="wrap wide"><h2 id="stepTitle" tabindex="-1">Your recommended boilers</h2>' +
    '<p class="help">We analysed your answers, ruled out boilers that do not suit your home and ranked the rest.</p>' +
    '<div class="analysis">' +
    '<div class="tile"><div class="v">' + N.area + ' m²</div><div class="k">Home size' + (N.areaKnown ? '' : ' (estimated from bedrooms)') + '</div></div>' +
    '<div class="tile"><div class="v">≈ ' + N.heat + ' kW</div><div class="k">Estimated heating need</div></div>' +
    '<div class="tile"><div class="v">≈ ' + N.flow + ' L/min</div><div class="k">Peak hot water, ' + N.concurrent + ' outlet' + (N.concurrent > 1 ? 's' : '') + ' at once</div></div>' +
    '<div class="tile"><div class="v" style="font-size:1.15rem">' + hw + '</div><div class="k">Hot water approach</div></div></div>' +
    renderGauge(R, bestId);
  if(!R.picks.length){
    h += '<div class="panel"><h3>We need a survey to recommend a boiler</h3><p>None of the demo boilers fit this combination of requirements. Southwark Heating can assess your home and advise on the right boiler.</p></div>';
  } else {
    h += '<div class="cards n' + Math.min(R.picks.length, 3) + '">' + R.picks.map(function(p){ return renderCard(p); }).join('') + '</div>';
    if(R.picks.length > 1){
      h += '<button class="btn btn-ghost" type="button" data-act="compare">' + (state.compare ? 'Hide comparison' : 'Compare these options') + '</button>' + (state.compare ? renderCompare(R) : '');
    }
  }
  const out = R.evals.filter(function(e){ return !e.ok; });
  h += '<details class="more"><summary>Why ' + out.length + ' other model' + (out.length === 1 ? ' was' : 's were') + ' ruled out</summary><div class="in"><ul class="ruled">' +
    out.map(function(e){ return '<li><b>' + esc(e.boiler.manufacturer + ' ' + e.boiler.model) + '</b>: ' + esc(e.reason) + '</li>'; }).join('') + '</ul></div></details>' +
    DISCLAIMER +
    '<div class="nav-row"><button class="btn btn-ghost" type="button" data-act="edit">Change my answers</button></div><div class="spacer"></div></div>';
  return h;
}
function selbar(){
  const b = BOILERS.filter(function(x){ return x.id === state.selectedId; })[0];
  if(!b || state.view !== 'results') return '';
  return '<div class="selbar"><div class="t">' + esc(b.manufacturer + ' ' + b.model) + '<b data-sel>Estimated ' + gbp(totalFor(b).total) + '</b></div><button class="btn btn-red" type="button" data-act="summary">Review selection</button></div>';
}

function renderSummary(){
  const b = BOILERS.filter(function(x){ return x.id === state.selectedId; })[0];
  const a = state.a;
  if(!b) return '<div class="wrap"><p>No boiler selected.</p></div>';
  const t = totalFor(b), sel = state.extras[b.id] || {};
  const lines = EXTRAS.filter(function(x){ return x.appliesTo.indexOf(b.type) >= 0 && sel[x.id]; }).map(function(x){
    return '<div class="prow sub"><span>' + esc(x.label) + (sel[x.id] > 1 ? ' × ' + sel[x.id] : '') + '</span><span>' + gbp(x.price * sel[x.id]) + '</span></div>';
  }).join('');
  const labels = { propType:'Property', area:'Size', demand:'Hot water use', simult:'Used at once', system:'Current system', working:'Current boiler working', sameLoc:'Same location' };
  const readable = function(key){ const o = OPT[key].filter(function(x){ return x.v === a[key]; })[0]; return o ? o.t : '-'; };
  return '<div class="wrap"><h2 id="stepTitle" tabindex="-1">Your selected boiler</h2><p class="help">Review your choice and estimated price.</p>' +
    '<div class="panel summary"><div class="chips" style="margin-bottom:8px"><span class="chip">' + PRICING.label + ' MODEL AND PRICE</span></div>' +
    '<h3>' + esc(b.manufacturer + ' ' + b.model) + '</h3><p style="margin:2px 0 10px;color:#5A6978">' + b.output + ' kW ' + b.type + ' · ' + b.warranty + '-year warranty</p>' +
    '<div class="prow"><span>Boiler, flue and fittings</span><span>' + gbp(t.p.boilerAndFlue) + '</span></div>' +
    '<div class="prow"><span>Standard installation package</span><span>' + gbp(t.p.pkgTotal) + '</span></div>' + lines +
    '<div class="prow total"><span>Estimated total</span><span>' + gbp(t.total) + '</span></div></div>' +
    '<div class="panel summary" style="margin-top:16px"><h3 style="margin-bottom:10px">Your details and answers</h3><dl>' +
    '<dt>Name</dt><dd>' + esc(a.name) + '</dd><dt>Address</dt><dd>' + esc(a.address) + ', ' + esc(a.postcode.toUpperCase()) + '</dd><dt>Phone</dt><dd>' + esc(a.phone) + '</dd><dt>Email</dt><dd>' + esc(a.email) + '</dd>' +
    Object.keys(labels).map(function(k){ return '<dt>' + labels[k] + '</dt><dd>' + esc(readable(k)) + '</dd>'; }).join('') +
    '<dt>Bedrooms / floors</dt><dd>' + a.beds + ' / ' + a.floors + '</dd><dt>Bathrooms / showers / baths</dt><dd>' + a.baths + ' / ' + a.showers + ' / ' + a.tubs + '</dd>' +
    (a.exModel ? '<dt>Current boiler</dt><dd>' + esc(a.exModel) + '</dd>' : '') + '</dl></div>' +
    DISCLAIMER +
    '<div class="panel" style="border-top:4px solid var(--navy)"><b>Prototype end point.</b> In the real website this is where the enquiry would be sent to Southwark Heating for confirmation. Nothing has been sent or paid.</div>' +
    '<div class="nav-row"><button class="btn btn-ghost" type="button" data-act="toResults">Back to options</button><button class="btn btn-navy" type="button" data-act="print">Print this page</button></div>' +
    '<p style="text-align:center"><button class="linklike" type="button" data-act="restart">Start a new quote</button></p></div>';
}

/* ---------- render + events ---------- */
function render(focus){
  const app = $('#app');
  const quiz = state.view === 'quiz';
  $('#progress').hidden = !(quiz && state.step > 0);
  if(quiz && state.step > 0){
    const pct = Math.round(state.step / QSTEPS * 100);
    $('#progLabel').textContent = 'Question ' + state.step + ' of ' + QSTEPS;
    $('#progFill').style.width = pct + '%';
    $('#progBar').setAttribute('aria-valuenow', pct);
  }
  app.innerHTML = state.view === 'quiz' ? renderQuiz() : state.view === 'results' ? renderResults() + selbar() : renderSummary();
  if(focus){
    window.scrollTo(0, 0);
    const t = $('#stepTitle') || $('#main');
    if(t) t.focus({ preventScroll:true });
  }
  save();
}
function refreshPrices(){
  const R = state.R; if(!R) return;
  R.picks.forEach(function(p){
    const el = document.querySelector('[data-price="' + p.e.boiler.id + '"]'); if(el) el.innerHTML = priceRows(p.e.boiler);
    const c = document.querySelector('[data-cmp="' + p.e.boiler.id + '"]'); if(c) c.textContent = gbp(totalFor(p.e.boiler).total);
  });
  const b = BOILERS.filter(function(x){ return x.id === state.selectedId; })[0];
  const s = document.querySelector('[data-sel]'); if(b && s) s.textContent = 'Estimated ' + gbp(totalFor(b).total);
  save();
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act],[data-step]'); if(!t) return;
  if(t.dataset.step){
    const f = STEPS.reduce(function(r, s){ return r || (s.fields || []).filter(function(x){ return x.key === t.dataset.step; })[0]; }, null);
    state.a[f.key] = Math.max(f.min, Math.min(f.max, state.a[f.key] + parseInt(t.dataset.d, 10)));
    render(false); const again = document.querySelector('[data-step="' + f.key + '"][data-d="' + t.dataset.d + '"]'); if(again && !again.disabled) again.focus();
    return;
  }
  const act = t.dataset.act;
  if(act === 'start'){ state.step = 1; render(true); }
  else if(act === 'back'){ errors = {}; state.step = Math.max(0, state.step - 1); render(true); }
  else if(act === 'next'){
    const s = STEPS[state.step];
    if(!stepValid(s)){ render(false); const bad = document.querySelector('.bad'); if(bad) bad.focus(); return; }
    if(state.step === STEPS.length - 1){ state.view = 'results'; state.selectedId = null; state.extras = {}; state.compare = false; } else state.step++;
    render(true);
  }
  else if(act === 'choose'){
    if(state.selectedId === t.dataset.id){ state.view = 'summary'; render(true); return; }
    state.selectedId = t.dataset.id; render(false);
    const sel = document.querySelector('.bcard.chosen'); if(sel) sel.scrollIntoView({ block:'center' });
  }
  else if(act === 'summary'){ state.view = 'summary'; render(true); }
  else if(act === 'toResults'){ state.view = 'results'; render(true); }
  else if(act === 'compare'){ state.compare = !state.compare; render(false); }
  else if(act === 'edit'){ state.view = 'quiz'; state.step = 1; render(true); }
  else if(act === 'print'){ window.print(); }
  else if(act === 'restart'){ if(confirm('Start a new quote? Your answers will be cleared.')){ state = freshState(); try{ localStorage.removeItem(KEY); }catch(x){} render(true); } }
});
document.getElementById('restartTop').addEventListener('click', function(){
  if(confirm('Start again? Your answers will be cleared.')){ state = freshState(); try{ localStorage.removeItem(KEY); }catch(x){} render(true); }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.type === 'radio' && STEPS[state.step] && STEPS[state.step].key === t.name){
    state.a[t.name] = t.value; save();
    const nb = $('#nextBtn'); if(nb) nb.disabled = false;
  } else if(t.dataset.x){
    const p = t.dataset.x.split('|'); const cur = state.extras[p[0]] || (state.extras[p[0]] = {});
    cur[p[1]] = t.type === 'checkbox' ? (t.checked ? 1 : 0) : parseInt(t.value, 10);
    refreshPrices();
  } else if(t.dataset.f === 'exKwUnknown'){
    state.a.exKwUnknown = t.checked; if(t.checked){ state.a.exKw = ''; } render(false); const c = $('#exKwUnknown'); if(c) c.focus();
  }
});
document.addEventListener('input', function(e){
  const t = e.target;
  if(t.dataset.f && t.type !== 'checkbox'){ state.a[t.dataset.f] = t.value; save(); if(errors[t.dataset.f]){ delete errors[t.dataset.f]; t.classList.remove('bad'); const er = document.getElementById('e-' + t.dataset.f); if(er) er.remove(); } }
});
render(false);
</script>
