<style>
:root{--navy:#112B4F;--red:#C42727;--ink:#1B2733;--muted:#5A6978;--line:#DDE3E9;--bg:#F4F6F9}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{background:#fff;border-bottom:4px solid var(--red);padding:calc(24px + env(safe-area-inset-top,0px)) 20px 22px;text-align:center}
.logo{display:block;margin:0 auto;width:100%;max-width:520px;height:auto}
.hero{background:var(--navy);color:#fff;text-align:center;padding:40px 20px 44px}
.hero h1{margin:0 0 10px;font-size:clamp(1.9rem,6.5vw,2.8rem);line-height:1.15}
.hero p{margin:0 auto;max-width:34rem;font-size:1.05rem;color:rgba(255,255,255,.85)}
.services{margin-top:18px!important;font-weight:600;color:#fff!important;letter-spacing:.02em}
main{max-width:640px;margin:0 auto;padding:32px 20px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1.05rem;color:var(--navy)}
.row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.label{flex:0 0 5rem;color:var(--muted);font-size:.95rem}
.value{font-size:1.15rem;font-weight:600;word-break:break-word}
a.value{color:var(--red);text-decoration:none}
a.value:hover{text-decoration:underline}
a:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:3px}
.gas{font-size:1.1rem;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 20px 28px}
</style>
