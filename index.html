e\"]{background:var(--bg);color:var(--ink)}\nnav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}\n.panel{display:none}\n.panel.on{display:block}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}\nh2{font-size:1.05rem;margin:0 0 10px}\nh3{font-size:.95rem;margin:14px 0 8px}\nlabel{display:block;font-weight:600;font-size:.92rem;margin:10px 0 4px}\n.hint{font-weight:400;color:var(--muted);font-size:.82rem}\ninput,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}\ninput[type=number]{font-variant-numeric:tabular-nums}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.seg button{border:0;background:var(--field);color:var(--ink);font:inherit;font-weight:600;padding:11px;cursor:pointer;min-height:46px}\n.seg button[aria-pressed=\"true\"]{background:var(--slate);color:#fff}\n.btn{border:0;border-radius:8px;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer;min-height:46px}\n.btn.red{background:var(--red);color:var(--red-ink)}\n.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}\n.timer{display:flex;gap:8px;align-items:center;margin-top:8px}\n.timer .t{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:700;min-width:5.2ch}\n.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}\n.big div{background:var(--slate);color:#fff;border-radius:10px;padding:12px 14px}\n.big small{display:block;color:#B9C4CF;font-size:.8rem}\n.big strong{font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}\n.big em{font-style:normal;font-size:.9rem;color:#B9C4CF;margin-left:4px}\ndl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}\ndt{color:var(--muted)}\ndd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}\n.tag{display:inline-block;border-radius:6px;padding:3px 9px;font-weight:700;font-size:.85rem}\n.ok{background:var(--ok-bg);color:var(--ok)}\n.warn{background:var(--warn-bg);color:var(--warn)}\n.bad{background:var(--bad-bg);color:var(--bad)}\n.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}\n.msg{border-radius:8px;padding:10px 12px;margin:10px 0 0;font-size:.92rem}\ntable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}\nth,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:.92rem}\nth{color:var(--muted);font-weight:600;font-size:.82rem}\ntd:nth-child(n+2),th:nth-child(n+2){text-align:right}\ntr.pick td{background:var(--ok-bg);font-weight:700}\n.scroll{overflow-x:auto}\nfooter{color:var(--muted);font-size:.8rem;margin-top:8px}\n@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <div class=\"brand\"><b>Southwark Heating<\/b><span>Gas tools<\/span><\/div>\n  <div class=\"bar\"><\/div>\n  <nav role=\"tablist\" aria-label=\"Tools\">\n    <button role=\"tab\" aria-selected=\"true\" data-tab=\"rate\">Gas rate<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"pipe\">Pipe sizing<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"vent\">Ventilation<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"purge\">Purge &amp; tightness<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"conv\">Converters<\/button>\n  <\/nav>\n<\/header>\n\n<!-- GAS RATE -->\n<section class=\"panel on\" id=\"rate\" role=\"tabpanel\">\n  <div class=\"card\">\n    <h2>Gas rate from the meter<\/h2>\n    <div class=\"seg\" role=\"group\" aria-label=\"Meter type\">\n      <button id=\"mMetric\" aria-pressed=\"true\">Metric (m\u00b3)<\/button>\n      <button id=\"mImp\" aria-pressed=\"false\">Imperial (ft\u00b3)<\/button>\n    <\/div>\n\n    <label for=\"gVol\">Volume passed <span class=\"hint\" id=\"gVolUnit\">in m\u00b3: one test-dial revolution, or end reading minus start reading<\/span><\/label>\n    <input id=\"gVol\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" placeholder=\"e.g. 0.01\">\n\n    <label for=\"gTime\">Time taken (seconds)<\/label>\n    <input id=\"gTime\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" placeholder=\"e.g. 20\">\n    <div class=\"timer\">\n      <span class=\"t\" id=\"tDisp\" aria-live=\"off\">0.0 s<\/span>\n      <button class=\"btn red\" id=\"tBtn\">Start<\/button>\n      <button class=\"btn ghost\" id=\"tReset\">Reset<\/button>\n    <\/div>\n    <p class=\"note\">Stop the timer to copy the time into the field above.<\/p>\n\n    <label for=\"gCV\">Calorific value (MJ/m\u00b3) <span class=\"hint\">from the gas bill<\/span><\/label>\n    <input id=\"gCV\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"30\" max=\"50\" value=\"39.5\">\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Result<\/h2>\n    <div class=\"big\">\n      <div><small>Net input<\/small><strong id=\"rNet\">\u2013<\/strong><em>kW<\/em><\/div>\n      <div><small>Gross input<\/small><strong id=\"rGross\">\u2013<\/strong><em>kW<\/em><\/div>\n    <\/div>\n    <dl>\n      <dt>Gas rate<\/dt><dd id=\"rM3\">\u2013<\/dd>\n      <dt>Gas rate<\/dt><dd id=\"rFt3\">\u2013<\/dd>\n      <dt>Gross input<\/dt><dd id=\"rBtu\">\u2013<\/dd>\n    <\/dl>\n    <div id=\"gMsg\"><\/div>\n    <p class=\"note\">Natural gas only. Net = gross \u00d7 0.9. Gross kW = m\u00b3/h \u00d7 CV \u00f7 3.6.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Compare with data plate<\/h2>\n    <div class=\"row\">\n      <div><label for=\"gRated\">Rated input (kW)<\/label>\n        <input id=\"gRated\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" placeholder=\"e.g. 24\"><\/div>\n      <div><label for=\"gBasis\">Rated on<\/label>\n        <select id=\"gBasis\"><option value=\"net\">Net<\/option><option value=\"gross\">Gross<\/option><\/select><\/div>\n    <\/div>\n    <div id=\"gCmp\"><\/div>\n    <p class=\"note\">Check the appliance instructions for the tolerance that applies. The \u00b15% flag here is a guide only.<\/p>\n  <\/div>\n<\/section>\n\n<!-- PIPE SIZING -->\n<section class=\"panel\" id=\"pipe\" role=\"tabpanel\">\n  <div class=\"card\">\n    <h2>Pipe sizing, natural gas, low pressure<\/h2>\n    <div class=\"row\">\n      <div><label for=\"pLoad\">Total load<\/label>\n        <input id=\"pLoad\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"30\"><\/div>\n      <div><label for=\"pBasis\">Load is in<\/label>\n        <select id=\"pBasis\"><option value=\"net\">kW net<\/option><option value=\"gross\">kW gross<\/option><option value=\"m3\">m\u00b3/h<\/option><\/select><\/div>\n    <\/div>\n    <div class=\"row\">\n      <div><label for=\"pLen\">Pipe run (m)<\/label>\n        <input id=\"pLen\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"10\"><\/div>\n      <div><label for=\"pDrop\">Allowed drop (mbar)<\/label>\n        <input id=\"pDrop\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"1\"><\/div>\n    <\/div>\n    <div class=\"row\">\n      <div><label for=\"pEl\">Elbows / bends<\/label>\n        <input id=\"pEl\" type=\"number\" inputmode=\"numeric\" min=\"0\" value=\"2\"><\/div>\n      <div><label for=\"pTee\">Tees<\/label>\n        <input id=\"pTee\" type=\"number\" inputmode=\"numeric\" min=\"0\" value=\"0\"><\/div>\n    <\/div>\n    <div class=\"row\">\n      <div><label for=\"pElL\">Allowance per elbow (m)<\/label>\n        <input id=\"pElL\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"0.5\"><\/div>\n      <div><label for=\"pTeeL\">Allowance per tee (m)<\/label>\n        <input id=\"pTeeL\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"0.5\"><\/div>\n    <\/div>\n    <label for=\"pCV\">Calorific value (MJ/m\u00b3)<\/label>\n    <input id=\"pCV\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"30\" max=\"50\" value=\"39.5\">\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Result<\/h2>\n    <div id=\"pSummary\"><\/div>\n    <div class=\"scroll\">\n    <table>\n      <thead><tr><th>Copper pipe<\/th><th>Drop (mbar)<\/th><th>Velocity (m/s)<\/th><th>Result<\/th><\/tr><\/thead>\n      <tbody id=\"pRows\"><\/tbody>\n    <\/table>\n    <\/div>\n    <p class=\"note\">Renouard low-pressure formula: drop (mbar) = 23200 \u00d7 0.6 \u00d7 L \u00d7 Q<sup>1.82<\/sup> \u00f7 D<sup>4.82<\/sup>, with L in m, Q in m\u00b3/h, D bore in mm. Pass needs the drop within the limit and velocity at or under 20 m/s. Fitting allowances are editable guide values: set them to the figures you work to. Check results against IGEM/UP/2 or BS 6891 tables before relying on them on a job.<\/p>\n  <\/div>\n<\/section>\n\n<!-- VENTILATION -->\n<section class=\"panel\" id=\"vent\" role=\"tabpanel\">\n  <div class=\"card\">\n    <h2>Domestic ventilation, open-flued appliance<\/h2>\n    <div class=\"row\">\n      <div><label for=\"vKw\">Appliance input<\/label>\n        <input id=\"vKw\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"24\"><\/div>\n      <div><label for=\"vBasis\">Input is<\/label>\n        <select id=\"vBasis\"><option value=\"gross\">kW gross<\/option><option value=\"net\">kW net<\/option><\/select><\/div>\n    <\/div>\n    <label for=\"vRoom\">Room type<\/label>\n    <select id=\"vRoom\">\n      <option value=\"room\">Room or internal space<\/option>\n      <option value=\"compartment_room\">Compartment ventilated to room<\/option>\n      <option value=\"compartment_outside\">Compartment ventilated direct to outside<\/option>\n    <\/select>\n    <p class=\"note\" id=\"vThreshold\"><\/p>\n  <\/div>\n  <div class=\"card\">\n    <h2>Result<\/h2>\n    <div class=\"big\">\n      <div><small>High level<\/small><strong id=\"vHigh\">\u2013<\/strong><em>cm\u00b2<\/em><\/div>\n      <div><small>Low level<\/small><strong id=\"vLow\">\u2013<\/strong><em>cm\u00b2<\/em><\/div>\n    <\/div>\n    <div id=\"vMsg\"><\/div>\n    <p class=\"note\">Based on BS 5440-2 guidance for open-flued appliances: 5 cm\u00b2 per kW above the first 7 kW (room), or 10/5 cm\u00b2 per kW above 7 kW for a compartment, using gross input. Grille free area is typically about 70% of its overall size \u2014 check the manufacturer's figure. Always confirm against BS 5440-2 and the appliance instructions before relying on this.<\/p>\n  <\/div>\n<\/section>\n\n<!-- PURGE & TIGHTNESS -->\n<section class=\"panel\" id=\"purge\" role=\"tabpanel\">\n  <div class=\"card\">\n    <h2>Pipe volume<\/h2>\n    <div class=\"row\">\n      <div><label for=\"xD\">Pipe bore (mm)<\/label>\n        <select id=\"xD\"><option value=\"13.6\">15 mm (13.6)<\/option><option value=\"20.2\" selected>22 mm (20.2)<\/option><option value=\"26.2\">28 mm (26.2)<\/option><option value=\"32.6\">35 mm (32.6)<\/option><option value=\"39.6\">42 mm (39.6)<\/option><option value=\"51.6\">54 mm (51.6)<\/option><\/select><\/div>\n      <div><label for=\"xL\">Pipe length (m)<\/label>\n        <input id=\"xL\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"10\"><\/div>\n    <\/div>\n    <dl id=\"xVolOut\" style=\"margin-top:12px\"><\/dl>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Purge volume &amp; time<\/h2>\n    <p class=\"note\">IGEM/UP/1A guidance: purge using at least one volume change for a readily ignitable gas-air mixture, discharging to a safe point. Enter the purge flow rate you're using to get an estimated time.<\/p>\n    <div class=\"row\">\n      <div><label for=\"xChanges\">Volume changes<\/label>\n        <input id=\"xChanges\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"1\" value=\"1\"><\/div>\n      <div><label for=\"xFlow\">Purge flow rate (m\u00b3/h)<\/label>\n        <input id=\"xFlow\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"0\" value=\"3\"><\/div>\n    <\/div>\n    <dl id=\"xPurgeOut\" style=\"margin-top:12px\"><\/dl>\n    <div id=\"xPurgeMsg\"><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Let-by / tightness test (IGEM/UP/1A)<\/h2>\n    <div class=\"row\">\n      <div><label for=\"tInit\">Initial reading (mbar)<\/label>\n        <input id=\"tInit\" type=\"number\" inputmode=\"decimal\" step=\"any\" value=\"20\"><\/div>\n      <div><label for=\"tFinal\">Final reading, 2 min (mbar)<\/label>\n        <input id=\"tFinal\" type=\"number\" inputmode=\"decimal\" step=\"any\" value=\"19.8\"><\/div>\n    <\/div>\n    <div id=\"tOut\"><\/div>\n    <p class=\"note\">Guide only: a drop of up to 4 mbar in 2 minutes on a let-by test at 20 mbar is commonly treated as satisfactory for a domestic installation \u2014 always check against the current IGEM/UP/1A procedure and your test equipment's instructions, since the correct limit depends on pipe volume and method.<\/p>\n  <\/div>\n<\/section>\n\n<!-- CONVERTERS -->\n<section class=\"panel\" id=\"conv\" role=\"tabpanel\">\n  <div class=\"card\">\n    <h2>Pressure<\/h2>\n    <div class=\"row\">\n      <div><label for=\"cpV\">Value<\/label><input id=\"cpV\" type=\"number\" inputmode=\"decimal\" step=\"any\" value=\"20\"><\/div>\n      <div><label for=\"cpU\">Unit<\/label>\n        <select id=\"cpU\"><option value=\"1\">mbar<\/option><option value=\"0.01\">Pa<\/option><option value=\"10\">kPa<\/option><option value=\"2.4908891\">inWG<\/option><option value=\"68.947573\">psi<\/option><\/select><\/div>\n    <\/div>\n    <dl id=\"cpOut\" style=\"margin-top:12px\"><\/dl>\n  <\/div>\n  <div class=\"card\">\n    <h2>Power<\/h2>\n    <div class=\"row\">\n      <div><label for=\"cwV\">Value<\/label><input id=\"cwV\" type=\"number\" inputmode=\"decimal\" step=\"any\" value=\"24\"><\/div>\n      <div><label for=\"cwU\">Unit<\/label>\n        <select id=\"cwU\"><option value=\"1\">kW<\/option><option value=\"0.000293071\">BTU/h<\/option><option value=\"0.277778\">MJ/h<\/option><\/select><\/div>\n    <\/div>\n    <dl id=\"cwOut\" style=\"margin-top:12px\"><\/dl>\n  <\/div>\n  <div class=\"card\">\n    <h2>Gas flow<\/h2>\n    <div class=\"row\">\n      <div><label for=\"cfV\">Value<\/label><input id=\"cfV\" type=\"number\" inputmode=\"decimal\" step=\"any\" value=\"2.5\"><\/div>\n      <div><label for=\"cfU\">Unit<\/label>\n        <select id=\"cfU\"><option value=\"1\">m\u00b3/h<\/option><option value=\"0.0283168\">ft\u00b3/h<\/option><option value=\"0.06\">litres/min<\/option><\/select><\/div>\n    <\/div>\n    <label for=\"cfCV\">Calorific value (MJ/m\u00b3)<\/label>\n    <input id=\"cfCV\" type=\"number\" inputmode=\"decimal\" step=\"any\" min=\"30\" max=\"50\" value=\"39.5\">\n    <dl id=\"cfOut\" style=\"margin-top:12px\"><\/dl>\n  <\/div>\n<\/section>\n\n<footer>For use by qualified gas engineers. Results are a guide: check them yourself.<\/footer>\n<\/div>\n\n<script>\n(function(){\n  var $=function(id){return document.getElementById(id)};\n  var num=function(id){var v=parseFloat($(id).value);return isFinite(v)?v:NaN};\n  var fmt=function(v,d){return isFinite(v)?v.toFixed(d):'\u2013'};\n  var FT3=0.0283168, BTU=3412.14, NET=0.9;\n\n  /* Tabs */\n  var tabs=document.querySelectorAll('nav button');\n  tabs.forEach(function(b){b.addEventListener('click',function(){\n    tabs.forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});\n    document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.tab)});\n  })});\n\n  /* ---------- Gas rate ---------- */\n  var imperial=false;\n  function setMode(imp){\n    imperial=imp;\n    $('mMetric').setAttribute('aria-pressed',!imp);\n    $('mImp').setAttribute('aria-pressed',imp);\n    $('gVolUnit').textContent=imp?'in ft\u00b3: one test-dial revolution, or end reading minus start reading':'in m\u00b3: one test-dial revolution, or end reading minus start reading';\n    $('gVol').placeholder=imp?'e.g. 1':'e.g. 0.01';\n    calcRate();\n  }\n  $('mMetric').addEventListener('click',function(){setMode(false)});\n  $('mImp').addEventListener('click',function(){setMode(true)});\n\n  function calcRate(){\n    var vol=num('gVol'), t=num('gTime'), cv=num('gCV');\n    var msg=$('gMsg'); msg.innerHTML='';\n    var ok=vol>0&&t>0&&cv>0;\n    if(!ok){\n      ['rNet','rGross','rM3','rFt3','rBtu'].forEach(function(i){$(i).textContent='\u2013'});\n      $('gCmp').innerHTML=''; return;\n    }\n    var m3=imperial?vol*FT3:vol;\n    var m3h=m3*3600/t;\n    var gross=m3h*cv/3.6;\n    var net=gross*NET;\n    $('rNet').textContent=fmt(net,2);\n    $('rGross').textContent=fmt(gross,2);\n    $('rM3').textContent=fmt(m3h,3)+' m\u00b3/h';\n    $('rFt3').textContent=fmt(m3h/FT3,1)+' ft\u00b3/h';\n    $('rBtu').textContent=Math.round(gross*BTU).toLocaleString('en-GB')+' BTU/h';\n    if(t<20) msg.innerHTML='<div class=\"msg warn\">Short timing. Use a longer test or a larger volume for a steadier reading.<\/div>';\n\n    var rated=num('gRated'), basis=$('gBasis').value;\n    var cmp=$('gCmp');\n    if(rated>0){\n      var meas=basis==='net'?net:gross;\n      var diff=(meas-rated)/rated*100;\n      var cls=Math.abs(diff)<=5?'ok':(Math.abs(diff)<=10?'warn':'bad');\n      var word=Math.abs(diff)<=5?'Within 5%':(diff>0?'High':'Low');\n      cmp.innerHTML='<dl style=\"margin-top:12px\"><dt>Measured ('+basis+')<\/dt><dd>'+fmt(meas,2)+' kW<\/dd><dt>Rated ('+basis+')<\/dt><dd>'+fmt(rated,2)+' kW<\/dd><dt>Difference<\/dt><dd>'+(diff>0?'+':'')+fmt(diff,1)+'%<\/dd><\/dl><div class=\"msg '+cls+'\"><b>'+word+'<\/b> against the data plate.<\/div>';\n    } else cmp.innerHTML='';\n  }\n  ['gVol','gTime','gCV','gRated','gBasis'].forEach(function(id){$(id).addEventListener('input',calcRate)});\n\n  /* Timer */\n  var tRun=false, tStart=0, tRaf=null;\n  function tick(){\n    var s=(performance.now()-tStart)/1000;\n    $('tDisp').textContent=s.toFixed(1)+' s';\n    tRaf=requestAnimationFrame(tick);\n  }\n  $('tBtn').addEventListener('click',function(){\n    if(!tRun){\n      tRun=true; tStart=performance.now(); $('tBtn').textContent='Stop'; tick();\n    } else {\n      tRun=false; cancelAnimationFrame(tRaf);\n      var s=(performance.now()-tStart)/1000;\n      $('tDisp').textContent=s.toFixed(1)+' s';\n      $('gTime').value=s.toFixed(1);\n      $('tBtn').textContent='Start'; calcRate();\n    }\n  });\n  $('tReset').addEventListener('click',function(){\n    tRun=false; cancelAnimationFrame(tRaf);\n    $('tDisp').textContent='0.0 s'; $('tBtn').textContent='Start';\n  });\n\n  /* ---------- Pipe sizing ---------- */\n  var PIPES=[['15 mm',13.6],['22 mm',20.2],['28 mm',26.2],['35 mm',32.6],['42 mm',39.6],['54 mm',51.6]];\n  function calcPipe(){\n    var load=num('pLoad'), basis=$('pBasis').value, L=num('pLen'), drop=num('pDrop'), cv=num('pCV');\n    var el=num('pEl')||0, tee=num('pTee')||0, elL=num('pElL')||0, teeL=num('pTeeL')||0;\n    var rows=$('pRows'), sum=$('pSummary');\n    rows.innerHTML=''; sum.innerHTML='';\n    if(!(load>0&&L>0&&drop>0&&cv>0)){ sum.innerHTML='<div class=\"msg warn\">Enter the load, run length, allowed drop and calorific value.<\/div>'; return; }\n    var q = basis==='m3'?load : (basis==='net'? (load/NET) : load)*3.6/cv;\n    var eqL = L + el*elL + tee*teeL;\n    var pick=-1, html='';\n    var results=PIPES.map(function(p,i){\n      var D=p[1];\n      var dp=23200*0.6*eqL*Math.pow(q,1.82)/Math.pow(D,4.82);\n      var area=Math.PI*Math.pow(D/1000,2)/4;\n      var v=(q/3600)/area;\n      var pass=dp<=drop && v<=20;\n      var renOK=(q/D)<=150;\n      return {name:p[0],dp:dp,v:v,pass:pass,renOK:renOK};\n    });\n    for(var i=0;i<results.length;i++){ if(results[i].pass){pick=i;break;} }\n    results.forEach(function(r,i){\n      var tag=r.pass?'<span class=\"tag ok\">Pass<\/span>':'<span class=\"tag bad\">Fail<\/span>';\n      html+='<tr'+(i===pick?' class=\"pick\"':'')+'><td>'+r.name+'<\/td><td>'+fmt(r.dp,2)+'<\/td><td>'+fmt(r.v,1)+'<\/td><td>'+tag+'<\/td><\/tr>';\n    });\n    rows.innerHTML=html;\n    var info='Flow '+fmt(q,2)+' m\u00b3/h over an effective length of '+fmt(eqL,1)+' m.';\n    if(pick>=0){\n      sum.innerHTML='<div class=\"msg ok\"><b>Smallest copper size that passes: '+results[pick].name+'.<\/b> '+info+'<\/div>';\n      if(!results[pick].renOK) sum.innerHTML+='<div class=\"msg warn\">Flow to bore ratio is outside the range the formula is valid for. Check against the published tables.<\/div>';\n    } else {\n      sum.innerHTML='<div class=\"msg bad\"><b>No size up to 54 mm passes.<\/b> '+info+' Shorten the run, raise the allowed drop where permitted, or check the load.<\/div>';\n    }\n  }\n  ['pLoad','pBasis','pLen','pDrop','pEl','pTee','pElL','pTeeL','pCV'].forEach(function(id){$(id).addEventListener('input',calcPipe)});\n\n  /* ---------- Converters ---------- */\n  function row(label,val){return '<dt>'+label+'<\/dt><dd>'+val+'<\/dd>'}\n  function convP(){\n    var v=num('cpV'), u=parseFloat($('cpU').value);\n    if(!isFinite(v)){$('cpOut').innerHTML='';return;}\n    var mb=v*u;\n    $('cpOut').innerHTML=row('mbar',fmt(mb,3))+row('Pa',fmt(mb*100,1))+row('kPa',fmt(mb/10,4))+row('inWG',fmt(mb/2.4908891,3))+row('psi',fmt(mb/68.947573,4));\n  }\n  function convW(){\n    var v=num('cwV'), u=parseFloat($('cwU').value);\n    if(!isFinite(v)){$('cwOut').innerHTML='';return;}\n    var kw=v*u;\n    $('cwOut').innerHTML=row('kW',fmt(kw,3))+row('BTU/h',Math.round(kw*BTU).toLocaleString('en-GB'))+row('MJ/h',fmt(kw*3.6,2));\n  }\n  function convF(){\n    var v=num('cfV'), u=parseFloat($('cfU').value), cv=num('cfCV');\n    if(!isFinite(v)){$('cfOut').innerHTML='';return;}\n    var m3h=v*u;\n    var h=row('m\u00b3/h',fmt(m3h,3))+row('ft\u00b3/h',fmt(m3h/FT3,1))+row('litres/min',fmt(m3h/0.06,1));\n    if(cv>0){ var g=m3h*cv/3.6; h+=row('kW gross',fmt(g,2))+row('kW net',fmt(g*NET,2)); }\n    $('cfOut').innerHTML=h;\n  }\n  ['cpV','cpU'].forEach(function(id){$(id).addEventListener('input',convP)});\n  ['cwV','cwU'].forEach(function(id){$(id).addEventListener('input',convW)});\n  ['cfV','cfU','cfCV'].forEach(function(id){$(id).addEventListener('input',convF)});\n\n  /* ---------- Ventilation ---------- */\n  function calcVent(){\n    var kwIn=num('vKw'), basis=$('vBasis').value, room=$('vRoom').value;\n    var out=$('vHigh'), out2=$('vLow'), msg=$('vMsg'), thr=$('vThreshold');\n    if(!(kwIn>0)){ out.textContent='\u2013'; out2.textContent='\u2013'; msg.innerHTML=''; thr.textContent=''; return; }\n    var gross = basis==='gross'? kwIn : kwIn/NET;\n    var threshold=7, rate=5, lowRate=5;\n    if(room==='compartment_room'){ rate=10; }\n    var excess=Math.max(0,gross-threshold);\n    var high=excess*rate;\n    var low = room==='compartment_outside' ? excess*lowRate : high;\n    thr.textContent='Using gross input of '+fmt(gross,2)+' kW. First '+threshold+' kW needs no permanent ventilation under this guidance.';\n    if(room==='room'){\n      out.textContent=fmt(high,0); out2.textContent='\u2013';\n      msg.innerHTML = gross<=threshold ? '<div class=\"msg ok\">No permanent ventilation required by this rule for a room installation at this input.<\/div>' : '';\n    } else {\n      out.textContent=fmt(high,0); out2.textContent=fmt(low,0);\n      msg.innerHTML = gross<=threshold ? '<div class=\"msg ok\">No permanent ventilation required by this rule at this input.<\/div>' : '';\n    }\n  }\n  ['vKw','vBasis','vRoom'].forEach(function(id){$(id).addEventListener('input',calcVent)});\n\n  /* ---------- Purge & tightness ---------- */\n  function pipeVolLitres(D_mm,L_m){\n    var D=D_mm/1000;\n    return Math.PI/4*D*D*L_m*1000;\n  }\n  function calcPurge(){\n    var D=parseFloat($('xD').value), L=num('xL');\n    var vol = (D>0 && L>=0) ? pipeVolLitres(D,L) : NaN;\n    $('xVolOut').innerHTML = isFinite(vol) ? row('Pipe volume',fmt(vol,2)+' litres') : '';\n\n    var changes=num('xChanges'), flow=num('xFlow');\n    var out=$('xPurgeOut'), msg=$('xPurgeMsg');\n    if(isFinite(vol) && changes>0 && flow>0){\n      var purgeVolL = vol*changes;\n      var timeMin = (purgeVolL/1000)/flow*60;\n      out.innerHTML = row('Purge volume',fmt(purgeVolL,2)+' litres') + row('Estimated purge time',fmt(timeMin,1)+' min');\n      msg.innerHTML='';\n    } else { out.innerHTML=''; msg.innerHTML=''; }\n  }\n  ['xD','xL','xChanges','xFlow'].forEach(function(id){$(id).addEventListener('input',calcPurge)});\n\n  function calcTightness(){\n    var i=num('tInit'), f=num('tFinal');\n    var out=$('tOut');\n    if(!(isFinite(i)&&isFinite(f))){ out.innerHTML=''; return; }\n    var drop=i-f;\n    var cls = drop<=4 ? 'ok' : 'bad';\n    var word = drop<=4 ? 'Satisfactory against the 4 mbar guide' : 'Exceeds the 4 mbar guide \u2014 investigate';\n    out.innerHTML='<dl><dt>Pressure drop<\/dt><dd>'+fmt(drop,2)+' mbar<\/dd><\/dl><div class=\"msg '+cls+'\"><b>'+word+'.<\/b><\/div>';\n  }\n  ['tInit','tFinal'].forEach(function(id){$(id).addEventListener('input',calcTightness)});\n\n  calcRate(); calcPipe(); calcVent(); calcPurge(); calcTightness(); convP(); convW(); convF();\n})();\n<\/script>\n<\/body>\n<\/html>\n";

/* ---- shared helpers ---- */
const fxToday=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fxNow=()=>new Date().toTimeString().slice(0,5);
const fxLS=(k,v)=>{try{if(v===undefined)return localStorage.getItem('swh_'+k)||'';localStorage.setItem('swh_'+k,v)}catch(e){return ''}};
function fxDefaults(F,d,c,j){const V={},t=fxToday(),sa=(j&&j.address)||c.address||'';
 V.date=t;V.rn=c.name||'';V.c_n=c.name||'';V.c_a=c.address||'';V.c_p=c.postcode||'';V.c_t=c.phone||'';V.c_m='';
 V.s_n=c.name||'';V.s_a=sa;V.s_p=c.postcode||'';V.s_t=c.phone||'';V.s_m='';
 V.b_a=fxLS('ba');V.b_p=fxLS('bp');V.on=fxLS('on');V.oid=fxLS('oid');V.en=fxLS('on');
 ['rd','od','dt'].forEach(k=>V[k]=t);
 if(F.key=='acc'){V.cn=c.name||'';V.ca=sa+(c.postcode?'\n'+c.postcode:'');V.ct=[c.phone,c.email].filter(Boolean).join('\n');V.jr=(j&&(j.ref||j.number))||c.ref||'';V.rtm=fxNow();V.otm=fxNow()}
 if(F.key=='rtc'){V.aw=[c.name,sa,c.postcode].filter(Boolean).join('\n');V.ib=fxLS('on');V.ca2=fxLS('ba')+(fxLS('bp')?'\n'+fxLS('bp'):'');V.em='info@southwarkheating.com';V.cr=c.ref||'';V.pn=c.name||'';V.pd='' }
 return V}
/* ---- ENTRY SCREEN generated from the definition ---- */
function fxUI(b,V,F,d){const K=(k,t)=>window._fk.push([k,t]),id=k=>'fx_'+k,val=k=>V[k]==null?'':V[k];
 const one=f=>{const [k,l,t]=f;K(k,t);if(t=='cb')return `<label class="fxcb"><input type="checkbox" id="${id(k)}" ${V[k]?'checked':''}><span>${E(l)}</span></label>`;
  if(Array.isArray(t))return cpF(id(k),l,val(k),t);return field(id(k),l,val(k),t=='a'?'area':t=='d'?'date':t=='tm'?'time':'text')};
 switch(b.k){
 case'parties':{const g=(p,t)=>`<h3>${t}</h3>${one([p+'_n','Name','t'])}${one([p+'_a','Address','a'])}${one([p+'_p','Postcode','t'])}${one([p+'_t','Telephone','t'])}${one([p+'_m','Mobile','t'])}`;
  return `<details class="card"><summary><b>${E(b.c)} and site</b> <small class="mut">(filled in for you - tap to check or change)</small></summary>${g('c',E(b.c))}${g('s','Site Details')}<h3>Registered Business Details</h3>${one(['b_a','Business address','a'])}${one(['b_p','Business postcode','t'])}</details>`}
 case'party':{const w=b.who;if(w=='b')return `<details class="card"><summary><b>${E(b.t)}</b></summary>${one(['b_a','Business address','a'])}${one(['b_p','Business postcode','t'])}</details>`;return `<details class="card" open><summary><b>${E(b.t)}</b></summary>${one([w+'_n','Name','t'])}${one([w+'_a','Address','a'])}${one([w+'_p','Postcode','t'])}${one([w+'_t','Telephone','t'])}</details>`}
 case'sec':return b.t.trim()?`<h2>${E(b.t.replace(/^\*/,''))}</h2>`:'';
 case'f':return `<div class="card">${b.f.map(one).join('')}</div>`;
 case'tbl':return `<div class="card">${b.lead?`<b>${E(b.lead)}</b>`:''}${b.rows.map((r,i)=>`<b>${E(r)}</b><div class="grid">${b.cols.map(c=>{const k=b.p+i+'_'+c[0];K(k,'t');return `<div>${field(id(k),c[1],val(k),'text')}</div>`}).join('')}</div>`).join('')}</div>`;
 case'chk':return `<h2>${E(b.h?'Checks':b.t)}</h2><div class="card">${b.rows.map((r,i)=>{const k=b.p+i,kr=k+'r';K(k,FYNA);K(kr,'t');return `<b>${E(r)}</b><div class="grid"><div>${cpF(id(k),'Yes / No / N/A',val(k),b.h?['Yes','No']:FYNA)}</div><div>${field(id(kr),b.h?'Comments / actions required':'Remedial action / nature of defect',val(kr),'text')}</div></div>`}).join('')}</div>`;
 case'cbs':return b.g.map(g=>`<div class="card"><b>${E(g.t)}</b>${g.i.map(one).join('')}</div>`).join('');
 case'cbt':return `<div class="card">${b.r.map(r=>{K(r[0],'cb');K(r[0]+'t','t');return `<label class="fxcb"><input type="checkbox" id="${id(r[0])}" ${V[r[0]]?'checked':''}><span>${E(r[1])}</span></label>${field(id(r[0]+'t'),'Details - '+r[1],val(r[0]+'t'),'text')}`}).join('')}</div>`;
 case'radio':K(b.key,b.o);return `<div class="card">${cpF(id(b.key),'Making good arrangement',val(b.key),b.o)}</div>`;
 case'area':K(b.p,'a');return `<h2>${E(b.t)}</h2><div class="card">${field(id(b.p),b.t,val(b.p),'area')}</div>`;
 case'cols':case'stack':return b.b.map(x=>fxUI(x,V,F,d)).join('');
 case'wtbl':{let h='<h2>Appliances / installation</h2>';for(let i=0;i<b.n;i++){const k=n=>'w'+i+'_'+n;h+=`<div class="card"><b>Appliance ${i+1}</b>${one([k('loc'),'Location','t'])}${one([k('typ'),'Appliance Type','t'])}${one([k('mk'),'Make','t'])}${one([k('md'),'Model','t'])}${[['ge','Gas Escape'],['pw','Pipework Issue'],['fl','Chimney / Flue'],['mt','Meter'],['vt','Ventilation']].map(a=>one([k(a[0]),a[1],'cb'])).join('')}${one([k('ot'),'Other Issue','t'])}${one([k('cl'),'Safety Classification & Safety Action Taken',['Immediately Dangerous','At Risk - Turned Off','At Risk - Further Assessment Required']])}</div>`}return h}
 case'rtbl':return `<div class="card">${RISKQ.map(q=>{const a='rk_'+q[0]+'_a',r='rk_'+q[0]+'_r',c='rk_'+q[0]+'_c';K(a,'t');K(r,'t');K(c,'t');return `<b>${E(q[1])}</b>${q[3]?`<small class="mut"><br>${E(q[3].join(' '))}</small>`:''}<div class="grid"><div>${q[2]=='yn'?cpF(id(a),'Answer',val(a),FYN):field(id(a),'Number',val(a),'text')}</div><div>${field(id(r),'Risk',val(r),'text')}</div></div>${field(id(c),'Comments / actions required',val(c),'text')}`}).join('')}</div>`;

/* Supabase warns against awaiting its own calls inside this callback (can deadlock) - so hand the work to setTimeout. Only act on a real sign-in, not on every token refresh / app refocus. */
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(async()=>{if(ev=='PASSWORD_RECOVERY'){recover();return}if(window._rec)return;

setTimeout(()=>{if(window._rec&&!A.innerHTML)recover()},3000);
addEventListener('hashchange',e=>{if(SKIP){SKIP=0;return}PREV=(e.oldURL.split('#')[1]||'');if(window._rec||!_uid)return;route()});
